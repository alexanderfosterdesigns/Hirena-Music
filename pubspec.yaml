name: hirena_music
description: "Hirena Music — a Netflix-designed, Deezer-streaming desktop player with a self-learning recommendation engine."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3

  # Crypto (Blowfish, AES, MD5)
  pointycastle: ^3.9.1
  crypto: ^3.0.3

  # Audio
  just_audio: ^0.9.38

  # Storage & cache
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  sqflite_common_ffi: ^2.3.3
  cached_network_image: ^3.3.1

  # Utilities
  uuid: ^4.4.0
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
        - asset: assets/fonts/Barlow-Black.ttf
          weight: 900
